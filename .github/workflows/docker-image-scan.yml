name: Docker Image Scan

on:
  push:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'frontend/**'
      - '.github/workflows/docker-image-scan.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'frontend/**'
      - '.github/workflows/docker-image-scan.yml'

permissions:
  contents: read
  security-events: write   # required to upload SARIF to GitHub Security tab
  issues: write            # required to open/update HIGH severity tracking issues

jobs:
  scan-backend:
    name: Scan Backend Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Build backend builder stage
        run: docker build --target builder -t cosmosvote-backend-builder:${{ github.sha }} .

      - name: Build backend runtime stage
        run: docker build --target runtime -t cosmosvote-backend-runtime:${{ github.sha }} .

      - name: Run Trivy scan on backend builder image (CRITICAL — fail build)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.28.0
        with:
          image-ref: cosmosvote-backend-builder:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          trivyignores: .trivyignore

      - name: Run Trivy scan on backend runtime image (CRITICAL — fail build)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.28.0
        with:
          image-ref: cosmosvote-backend-runtime:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          trivyignores: .trivyignore

      - name: Run Trivy scan on backend builder image (HIGH — warn only)
        if: always()
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.28.0
        with:
          image-ref: cosmosvote-backend-builder:${{ github.sha }}
          format: json
          output: trivy-backend-builder-high.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH'
          trivyignores: .trivyignore

      - name: Run Trivy scan on backend runtime image (HIGH — warn only)
        if: always()
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.28.0
        with:
          image-ref: cosmosvote-backend-runtime:${{ github.sha }}
          format: json
          output: trivy-backend-runtime-high.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH'
          trivyignores: .trivyignore

      - name: Warn on HIGH severity CVEs (backend)
        if: always()
        run: |
          count=0
          for f in trivy-backend-builder-high.json trivy-backend-runtime-high.json; do
            if [ -f "$f" ]; then
              n=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$f")
              count=$((count + n))
            fi
          done
          if [ "$count" -gt 0 ]; then
            echo "::warning::Found $count HIGH severity CVE(s) in backend images"
          else
            echo "No HIGH severity CVEs found in backend images"
          fi

      - name: Open or update HIGH severity tracking issue (backend)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=0
          for f in trivy-backend-builder-high.json trivy-backend-runtime-high.json; do
            if [ -f "$f" ]; then
              n=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$f")
              count=$((count + n))
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "No HIGH severity CVEs; no tracking issue needed"
            exit 0
          fi
          title="[Security] HIGH severity CVEs in backend Docker image"
          body=$(printf 'Trivy detected %s HIGH severity CVE(s) in the backend Docker image (builder/runtime stages) at commit %s.\n\nSee the `docker-image-scan` workflow run: %s/%s/actions/runs/%s\n\nScan artefacts are attached to that run.' \
            "$count" "${{ github.sha }}" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi

      - name: Run Trivy scan on backend images (SARIF — upload to Security tab)
        if: always()   # upload even when a scan step fails so the report is visible
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.28.0
        with:
          image-ref: cosmosvote-backend-runtime:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          trivyignores: .trivyignore

      - name: Upload SARIF report (backend)
        if: always()
        uses: github/codeql-action/upload-sarif@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0 # v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload scan artefacts (backend)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-backend-results
          path: |
            trivy-backend.sarif
            trivy-backend-builder-high.json
            trivy-backend-runtime-high.json
          if-no-files-found: ignore

  scan-frontend:
    name: Scan Frontend Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Build frontend builder stage
        run: docker build --target builder -t cosmosvote-frontend-builder:${{ github.sha }} ./frontend

      - name: Build frontend runtime stage
        run: docker build --target runtime -t cosmosvote-frontend-runtime:${{ github.sha }} ./frontend

      - name: Run Trivy scan on frontend builder image (CRITICAL — fail build)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.28.0
        with:
          image-ref: cosmosvote-frontend-builder:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          trivyignores: .trivyignore

      - name: Run Trivy scan on frontend runtime image (CRITICAL — fail build)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.28.0
        with:
          image-ref: cosmosvote-frontend-runtime:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          trivyignores: .trivyignore

      - name: Run Trivy scan on frontend builder image (HIGH — warn only)
        if: always()
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.28.0
        with:
          image-ref: cosmosvote-frontend-builder:${{ github.sha }}
          format: json
          output: trivy-frontend-builder-high.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH'
          trivyignores: .trivyignore

      - name: Run Trivy scan on frontend runtime image (HIGH — warn only)
        if: always()
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.28.0
        with:
          image-ref: cosmosvote-frontend-runtime:${{ github.sha }}
          format: json
          output: trivy-frontend-runtime-high.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH'
          trivyignores: .trivyignore

      - name: Warn on HIGH severity CVEs (frontend)
        if: always()
        run: |
          count=0
          for f in trivy-frontend-builder-high.json trivy-frontend-runtime-high.json; do
            if [ -f "$f" ]; then
              n=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$f")
              count=$((count + n))
            fi
          done
          if [ "$count" -gt 0 ]; then
            echo "::warning::Found $count HIGH severity CVE(s) in frontend images"
          else
            echo "No HIGH severity CVEs found in frontend images"
          fi

      - name: Open or update HIGH severity tracking issue (frontend)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=0
          for f in trivy-frontend-builder-high.json trivy-frontend-runtime-high.json; do
            if [ -f "$f" ]; then
              n=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$f")
              count=$((count + n))
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "No HIGH severity CVEs; no tracking issue needed"
            exit 0
          fi
          title="[Security] HIGH severity CVEs in frontend Docker image"
          body=$(printf 'Trivy detected %s HIGH severity CVE(s) in the frontend Docker image (builder/runtime stages) at commit %s.\n\nSee the `docker-image-scan` workflow run: %s/%s/actions/runs/%s\n\nScan artefacts are attached to that run.' \
            "$count" "${{ github.sha }}" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi

      - name: Run Trivy scan on frontend image (SARIF — upload to Security tab)
        if: always()
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.28.0
        with:
          image-ref: cosmosvote-frontend-runtime:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          trivyignores: .trivyignore

      - name: Upload SARIF report (frontend)
        if: always()
        uses: github/codeql-action/upload-sarif@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0 # v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Upload scan artefacts (frontend)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-frontend-results
          path: |
            trivy-frontend.sarif
            trivy-frontend-builder-high.json
            trivy-frontend-runtime-high.json
          if-no-files-found: ignore
