name: Fuzz cast_vote (weekly)

# Run on a weekly schedule (every Monday at 02:00 UTC) and on manual dispatch.
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.78.0"

jobs:
  fuzz-cast-vote:
    name: Fuzz cast_vote tally invariants
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Run cast_vote fuzz / property tests
        run: |
          cargo test fuzz_cast_vote \
            --package cosmosvote-governance \
            --features testutils \
            -- --nocapture

      - name: Upload failing seeds as artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: fuzz-failing-seeds
          path: |
            contracts/governance/.proptest-regressions/
          retention-days: 30