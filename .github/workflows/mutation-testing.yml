name: Mutation Testing

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'contracts/governance/src/lib.rs'
      - 'contracts/governance/src/test.rs'

jobs:
  mutants:
    name: cargo-mutants (governance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.78.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run mutation testing
        run: |
          cargo mutants \
            --package cosmosvote-governance \
            --features testutils \
            --output mutants-out \
            -- --features testutils
      - name: Show surviving mutants
        if: always()
        run: |
          if [ -f mutants-out/missed.txt ]; then
            echo "=== Surviving mutants (missed) ==="
            cat mutants-out/missed.txt
          else
            echo "No surviving mutants."
          fi
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-report
          path: mutants-out/
          retention-days: 14
