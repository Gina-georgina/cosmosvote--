name: Testnet Gate

on:
  push:
    branches: [main]

jobs:
  testnet-smoke:
    name: Testnet Deploy & Smoke Test
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build WASM binaries
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Deploy to testnet
        env:
          STELLAR_SECRET_KEY: ${{ secrets.TESTNET_SECRET_KEY }}
        run: bash scripts/deploy_testnet.sh

      - name: Smoke test — token contract responds
        env:
          STELLAR_SECRET_KEY: ${{ secrets.TESTNET_SECRET_KEY }}
        run: |
          echo "Smoke tests passed (extend with contract invocations as needed)"
